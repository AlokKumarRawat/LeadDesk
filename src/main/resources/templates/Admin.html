<html>
	<head>
		<title>LeadDesk</title>
		<meta charset="utf-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
    	<link href="/css/output.css" rel="stylesheet">
	</head>

	<body class="bg-gray-100 min-h-screen flex flex-col">

		<div class="grid grid-cols-3 items-center bg-white shadow-md p-4 mx-4 mt-4 rounded-lg">

			<h2 class="text-2xl font-semibold text-gray-800">
				LeadDesk
			</h2>

			<div></div>

			<div class="text-right mx-2">
				<div class="font-semibold text-gray-800">Name</div>
				<div class="text-sm text-gray-500">Administrator</div>
			</div>

		</div>

		<div class="bg-white p-6 mt-8 mx-4 rounded-lg shadow-md flex-1 overflow-x-auto">
		
			<h3 class="my-5 text-2xl">Enquiry Table</h3>

			<table class="w-full border border-gray-300 border-collapse">

				<tr class="bg-gray-100 text-gray-700">
					<th class="p-3 border">Sr. No.</th>
					<th class="p-3 border">Name</th>
					<th class="p-3 border">Email</th>
					<th class="p-3 border">Budget</th>
					<th class="p-3 border">Message</th>
					<th class="p-3 border">Status</th>
					<th class="p-3 border">Action</th>
				</tr>

				<tr th:each="enquiry,srno : ${enquiries}" class="hover:bg-gray-50">

					<td class="p-3 border text-center" th:text="${srno.count}"></td>

					<td class="p-3 border" th:text="${enquiry.name}"></td>

					<td class="p-3 border" th:text="${enquiry.email}"></td>

					<td class="p-3 border text-center" th:text="${enquiry.budget}"></td>

					<td class="p-3 border" th:text="${enquiry.message}"></td>

					<td class="p-3 border text-center" th:text="${enquiry.status}"></td>

					<td class="p-3 border text-center">

						<a
							th:if="${enquiry.status.name()=='New'}"
							th:href="@{/status/{id}/{status}(id=${enquiry.id},status='New')}"
							class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md">
							Contact
						</a>

						<a
							th:if="${enquiry.status.name()=='Contact'}"
							th:href="@{/status/{id}/{status}(id=${enquiry.id},status='Contact')}"
							class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded-md">
							Close
						</a>
						<a
							th:href="@{/delete/{id}/(id=${enquiry.id})}"
							class="bg-red-600 hover:bg-red-700 mx-2 text-white px-3 py-1 rounded-md">
							Delete
						</a>

					</td>

				</tr>

			</table>

		</div>

		<footer class="bg-black text-white py-4 text-center mt-8">
			<a href="https://digitalheroesco.com">
				Built for Digital Heroes Training Task
			</a>
		</footer>

	</body>
</html>
