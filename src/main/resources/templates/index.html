<html>
	<head>
		<title>LeadDesk</title>
		<meta charset="utf-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
    	<link href="/css/output.css" rel="stylesheet">
	</head>
	<body class="bg-[#7f7f7f]">
		<header class="top-0 sticky">
			<div class="grid grid-cols-3 bg-white p-3 m-2  text-xl rounded-xl border border-gray-500">
			<h2 class="col-span-1 text-center text-2xl pt-1 text-[#9f9f9f]">LeadDesk</h2>
			<h2 class="text-center text-2xl "></h2>
			<h2 class="col-span-1 text-center flex justify-around">
				<a href="/login" class="p-1 bg-blue-400 rounded-2xl px-4 text-white">Login</a>
				<a href="/register" class="p-1 bg-blue-400 rounded-2xl px-4 text-white">Register</a>
			</h2>
		</div>
		</header>
		<main>
			<div class="bg-white p-5 mt-10 mx-auto w-2/3 md:w-1/3 rounded-md">
			<form action="/" th:object="${dto}" method="post">
				<label for="name" class="mt-2">Name</label>
				<input type="text" name="name" class="w-full border border-gray-500 outline-none p-2 mt-2 rounded-2xl" placeholder="Enter your Name" required>
				<label for="email" class="mt-2">Email</label>
				<input type="email" name="email" class="w-full border border-gray-500 outline-none p-2 mt-2 rounded-2xl" placeholder="Enter your Email" required>
				<label for="budget" class="mt-2">Budget</label>
				<input type="number" name="budget" class="w-full border border-gray-500 outline-none p-2 mt-2 rounded-2xl" placeholder="Enter your Budget" required>
				<label for="name" class="mt-2">Message</label>
				<textarea name="message" class="w-full border border-gray-500 outline-none p-2 mt-2 rounded-2xl" placeholder="Enter your Name" required></textarea>
				<div class="text-center "><button type="submit" class="p-2 px-3 bg-blue-500 mt-2 rounded-xl mx-auto text-white">Submit</button></div>
			</form>
		</div>
		<footer class="bg-black text-white my-2 p-2 text-center text-md">
			<a href="https://digitalheroesco.com">Built for Digital Heroes Training Task</a>
		</footer>
		</main>
		
		
	</body>
</html>
