<html>
	<head>
		<title>LeadDesk</title>
		<meta charset="utf-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
    	<link href="/css/output.css" rel="stylesheet">
	</head>

	<body class="bg-gray-100 min-h-screen flex flex-col">

		<header class="sticky top-0 bg-white shadow-sm">
			<div class="grid grid-cols-3 items-center p-4 max-w-6xl mx-auto">

				<h2 class="text-2xl font-semibold text-gray-800">
					LeadDesk
				</h2>

				<div></div>

				<div class="flex justify-end gap-3">
					<a href="/login"
						class="px-5 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
						Login
					</a>

					<a href="/register"
						class="px-5 py-2 border border-blue-600 text-blue-600 rounded-md hover:bg-blue-50 transition">
						Register
					</a>
				</div>

			</div>
		</header>

		<main class="flex-1">

			<div class="bg-white p-8 mt-10 mx-auto w-11/12 md:w-2/3 lg:w-1/3 rounded-lg shadow-md">

				<form action="/" th:object="${dto}" method="post">

					<label class="block text-gray-700 font-medium mb-2">
						Name
					</label>

					<input
						type="text"
						name="name"
						class="w-full border border-gray-300 rounded-md p-3 mb-5 outline-none focus:border-blue-500"
						placeholder="Enter your Name"
						required
					>

					<label class="block text-gray-700 font-medium mb-2">
						Email
					</label>

					<input
						type="email"
						name="email"
						class="w-full border border-gray-300 rounded-md p-3 mb-5 outline-none focus:border-blue-500"
						placeholder="Enter your Email"
						required
					>

					<label class="block text-gray-700 font-medium mb-2">
						Budget
					</label>

					<input
						type="number"
						name="budget"
						class="w-full border border-gray-300 rounded-md p-3 mb-5 outline-none focus:border-blue-500"
						placeholder="Enter your Budget"
						required
					>

					<label class="block text-gray-700 font-medium mb-2">
						Message
					</label>

					<textarea
						name="message"
						rows="4"
						class="w-full border border-gray-300 rounded-md p-3 mb-6 outline-none focus:border-blue-500"
						placeholder="Enter your Message"
						required></textarea>

					<button
						type="submit"
						class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 transition">
						Submit
					</button>

				</form>

			</div>

		</main>

		<footer class="bg-black text-white py-4 text-center mt-10">
			<a href="https://digitalheroesco.com">
				Built for Digital Heroes Training Task
			</a>
		</footer>

	</body>
</html>
